name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify required static assets
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f js/errors.js
          test -f js/pwa-install.js
          test -f docs/ble-protocol.schema.json
          grep -q 'manifest.webmanifest' index.html
          ! test -f manifest.json

      - name: Check DOM ID preservation
        run: bash scripts/check-ids.sh

      - name: Check PWA install contracts
        run: node scripts/check-pwa.mjs

      - name: Check BLE protocol contract
        run: node scripts/check-protocol.mjs

      - name: Verify PWA icon generation
        run: node scripts/generate-icons.mjs

      - name: Check icon outputs exist
        run: |
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/apple-touch-icon.png
