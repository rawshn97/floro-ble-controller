<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FloRo Sign Controller</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f19">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b111e;
      --card-bg: rgba(22, 33, 56, 0.45);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --neon-glow: #ff007f;
      --neon-glow-rgba: rgba(255, 0, 127, 0.25);
      --success: #10b981;
      --success-rgba: rgba(16, 185, 129, 0.25);
      --error: #ef4444;
      --error-rgba: rgba(239, 68, 68, 0.25);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(22, 33, 56, 0.5) 0px, transparent 50%),
        radial-gradient(at 100% 0%, var(--neon-glow-rgba) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-sizing: border-box;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    header img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      box-shadow: 0 0 20px var(--neon-glow-rgba);
      border: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, var(--neon-glow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .glass-card.active-glow {
      border-color: var(--neon-glow-rgba);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), 0 0 20px 0 var(--neon-glow-rgba);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Connection State UI */
    .connection-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .status-badge {
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 30px;
      background-color: var(--error);
      color: white;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
    }

    .status-badge.connected {
      background-color: var(--success);
      box-shadow: 0 0 15px var(--success-glow);
    }

    .btn {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-connect {
      background: linear-gradient(135deg, var(--neon-glow), #a855f7);
      border: none;
      box-shadow: 0 0 15px var(--neon-glow-rgba);
    }

    .btn-connect:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 25px var(--neon-glow-rgba);
    }

    .btn-disconnect {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border: none;
    }

    /* Power Buttons */
    .power-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-power-on {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      box-shadow: 0 0 15px var(--success-glow);
    }

    .btn-power-on:hover {
      box-shadow: 0 0 25px var(--success-glow);
      transform: translateY(-1px);
    }

    .btn-power-off {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      box-shadow: 0 0 15px var(--error-rgba);
    }

    .btn-power-off:hover {
      box-shadow: 0 0 25px var(--error-rgba);
      transform: translateY(-1px);
    }

    .power-status-indicator {
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--success);
      margin-top: 8px;
      text-align: center;
      letter-spacing: 1px;
    }

    .power-status-indicator.off {
      color: var(--error);
    }

    /* Slider Container styling */
    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .slider-val {
      font-weight: 700;
      color: var(--neon-glow);
      font-family: 'JetBrains Mono', monospace;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      margin: 10px 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      border: 2px solid var(--neon-glow);
      box-shadow: 0 0 10px var(--neon-glow-rgba);
      transition: transform 0.1s, background-color 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Disabled styling */
    .disabled-control {
      opacity: 0.35;
      pointer-events: none;
    }

    /* Color Swatches Grid */
    .color-swatches {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .swatch-btn {
      height: 48px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .swatch-btn:active {
      transform: scale(0.92);
    }

    .swatch-btn.selected {
      border: 2px solid white;
      box-shadow: 0 0 15px var(--neon-glow-rgba);
    }

    /* Color Picker */
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .color-picker-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 2px solid var(--border);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    /* Animation Mode Selector Controls */
    .animation-select-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }

    .anim-dropdown {
      flex-grow: 1;
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
      background-repeat: no-repeat;
      background-position-x: calc(100% - 12px);
      background-position-y: 50%;
      padding-right: 40px;
    }

    .anim-dropdown:focus {
      border-color: var(--neon-glow);
      box-shadow: 0 0 10px var(--neon-glow-rgba);
    }

    .btn-step {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 12px;
      font-size: 1.2rem;
      line-height: 1;
    }

    .favorites-section {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      margin-top: 16px;
    }

    .fav-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-add-fav {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    .favorites-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding: 2px;
    }

    .fav-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 14px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .fav-chip:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--neon-glow);
    }

    .fav-chip.active {
      background: var(--neon-glow-rgba);
      border-color: var(--neon-glow);
      box-shadow: 0 0 8px var(--neon-glow-rgba);
      font-weight: 600;
    }

    .fav-chip-remove {
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .fav-chip-remove:hover {
      background-color: var(--error);
      color: white;
    }

    /* Console Panel */
    .console-header {
      cursor: pointer;
      user-select: none;
    }

    .console-arrow {
      transition: transform 0.3s;
    }

    .console-arrow.collapsed {
      transform: rotate(-90deg);
    }

    .console-body {
      max-height: 120px;
      overflow-y: auto;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 12px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: max-height 0.3s ease, padding 0.3s ease, margin 0.3s ease;
    }

    .console-body.collapsed {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-top: 0;
      border: none;
      overflow: hidden;
    }

    .console-entry {
      line-height: 1.4;
      border-left: 2px solid var(--border);
      padding-left: 8px;
    }

    .console-entry.info { border-color: #3b82f6; color: #93c5fd; }
    .console-entry.success { border-color: var(--success); color: #a7f3d0; }
    .console-entry.error { border-color: var(--error); color: #fca5a5; }
    .console-entry.write { border-color: var(--neon-glow); color: #fbcfe8; }

    /* PWA Install Banner */
    .install-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--neon-glow-rgba);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <img src="logo.png" alt="FloRo Logo" onerror="this.src='floro.png';">
    <h1>FloRo Controller</h1>
  </header>

  <!-- PWA Install Banner -->
  <div id="install-banner" class="install-banner hidden">
    <div style="font-size: 0.9rem; font-weight: 500;">Install FloRo as an App</div>
    <button id="btn-install" class="btn btn-connect" style="padding: 6px 14px; font-size: 0.8rem;">Install</button>
  </div>

  <!-- Connection Panel -->
  <div class="glass-card">
    <div class="connection-row">
      <div>
        <div style="font-weight: 600; font-size: 1.1rem; margin-bottom: 2px;">Sign Connection</div>
        <div id="device-name" style="font-size: 0.85rem; color: var(--text-muted);">Disconnected</div>
      </div>
      <span id="connection-status" class="status-badge">OFFLINE</span>
    </div>
    
    <div style="margin-top: 15px;">
      <button id="btn-connect" class="btn btn-connect" style="width: 100%;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
        Scan & Connect Sign
      </button>
      <button id="btn-disconnect" class="btn btn-disconnect hidden" style="width: 100%;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        Disconnect Sign
      </button>
    </div>
  </div>

  <!-- Dedicated Power Panel -->
  <div id="power-panel" class="glass-card disabled-control">
    <div class="card-title">Sign Power</div>
    <div class="power-grid">
      <button id="btn-power-on" class="btn btn-power-on" onclick="setPowerState(true)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
        Power ON
      </button>
      <button id="btn-power-off" class="btn btn-power-off" onclick="setPowerState(false)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
        Power OFF
      </button>
    </div>
    <div id="power-status-text" class="power-status-indicator">POWER ON</div>
  </div>

  <!-- Brightness & Speed Card -->
  <div id="controls-panel" class="glass-card disabled-control">
    <div class="card-title">Adjustments</div>
    
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <!-- Brightness Slider (strictly 1 to 8, 0 is handled separately) -->
      <div class="slider-container">
        <div class="slider-label-row">
          <span>Brightness Level</span>
          <span class="slider-val" id="val-brightness">8 / 8</span>
        </div>
        <input type="range" id="slider-brightness" min="1" max="8" value="8">
      </div>

      <!-- Speed Slider -->
      <div class="slider-container">
        <div class="slider-label-row">
          <span>Animation Speed</span>
          <span class="slider-val" id="val-speed">50%</span>
        </div>
        <input type="range" id="slider-speed" min="0" max="100" value="50">
      </div>
    </div>
  </div>

  <!-- Color Control Panel -->
  <div id="color-panel" class="glass-card disabled-control">
    <div class="card-title">Neon Colors</div>
    
    <div class="color-swatches">
      <button class="swatch-btn selected" style="background: #ff0000;" onclick="selectSwatch(this, 255, 0, 0)" title="Ruby Red"></button>
      <button class="swatch-btn" style="background: #00ff00;" onclick="selectSwatch(this, 0, 255, 0)" title="Electric Green"></button>
      <button class="swatch-btn" style="background: #0000ff;" onclick="selectSwatch(this, 0, 0, 255)" title="Neon Blue"></button>
      <button class="swatch-btn" style="background: #ffff00;" onclick="selectSwatch(this, 255, 255, 0)" title="Sunny Yellow"></button>
      <button class="swatch-btn" style="background: #ff00ff;" onclick="selectSwatch(this, 255, 0, 255)" title="Hot Pink"></button>
      <button class="swatch-btn" style="background: #00ffff;" onclick="selectSwatch(this, 0, 255, 255)" title="Ice Cyan"></button>
      <button class="swatch-btn" style="background: #a855f7;" onclick="selectSwatch(this, 168, 85, 247)" title="Neon Purple"></button>
      <button class="swatch-btn" style="background: #ffffff;" onclick="selectSwatch(this, 255, 255, 255)" title="Bright White"></button>
    </div>

    <div class="color-picker-wrapper">
      <span class="color-picker-label">Custom Palette:</span>
      <input type="color" id="color-picker" value="#ff0000">
    </div>
  </div>

  <!-- Animation Panel (With full 200 mode select + Favorites list) -->
  <div id="animation-panel" class="glass-card disabled-control">
    <div class="card-title">Built-in Animations</div>
    
    <div class="animation-select-row">
      <button class="btn btn-step" onclick="stepMode(-1)">−</button>
      <select id="anim-dropdown" class="anim-dropdown">
        <!-- Dynamically populated from 1 to 200 -->
      </select>
      <button class="btn btn-step" onclick="stepMode(1)">+</button>
    </div>

    <div class="favorites-section">
      <div class="fav-header-row">
        <span style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted);">Quick Presets & Favorites</span>
        <button class="btn btn-add-fav" onclick="addCurrentToFavorites()">+ Add Current</button>
      </div>
      
      <div id="favorites-grid" class="favorites-grid">
        <!-- Persistent favorite chips loaded here -->
      </div>
    </div>
  </div>

  <!-- Diagnostics Log -->
  <div class="glass-card">
    <div class="card-title console-header" onclick="toggleConsole()">
      <span>Activity Console</span>
      <span id="console-arrow" class="console-arrow">▲</span>
    </div>
    <div id="console-body" class="console-body">
      <div class="console-entry info">System ready. Click Connect to find FloRo.</div>
    </div>
  </div>
</div>

<script>
  // Service Worker Registration for Offline Use
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        console.log('ServiceWorker registered successfully: ', reg.scope);
      }, (err) => {
        console.warn('ServiceWorker registration failed: ', err);
      });
    });
  }

  // BLE UUID Definitions
  const NUS_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
  const NUS_WRITE_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

  let bleDevice = null;
  let bleServer = null;
  let activeCharacteristic = null;

  // App UI State
  let isPoweredOn = true;
  let lastBrightnessVal = 8; // Saved brightness when ON (range 1-8)
  let activeColor = '#ff0000'; // Theme glow color
  let activeModeVal = 32;

  // Default Favorites (preloaded)
  const defaultFavorites = [
    { mode: 32, label: "Pattern 32" },
    { mode: 34, label: "Pattern 34" },
    { mode: 35, label: "Pattern 35" },
    { mode: 38, label: "Pattern 38" },
    { mode: 50, label: "Pattern 50" },
    { mode: 66, label: "Pattern 66" },
    { mode: 102, label: "Pattern 102" },
    { mode: 108, label: "Pattern 108" }
  ];

  // DOM Elements
  const btnConnect = document.getElementById('btn-connect');
  const btnDisconnect = document.getElementById('btn-disconnect');
  const deviceNameEl = document.getElementById('device-name');
  const connectionStatus = document.getElementById('connection-status');
  
  const powerPanel = document.getElementById('power-panel');
  const controlsPanel = document.getElementById('controls-panel');
  const colorPanel = document.getElementById('color-panel');
  const animationPanel = document.getElementById('animation-panel');
  const powerStatusText = document.getElementById('power-status-text');

  const sliderBrightness = document.getElementById('slider-brightness');
  const valBrightness = document.getElementById('val-brightness');
  const sliderSpeed = document.getElementById('slider-speed');
  const valSpeed = document.getElementById('val-speed');
  const colorPicker = document.getElementById('color-picker');
  const animDropdown = document.getElementById('anim-dropdown');
  const favoritesGrid = document.getElementById('favorites-grid');
  
  const consoleBody = document.getElementById('console-body');
  const consoleArrow = document.getElementById('console-arrow');

  // Populate Dropdown with Modes 1 to 200
  for (let i = 1; i <= 200; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `Animation Mode ${i}`;
    animDropdown.appendChild(opt);
  }
  animDropdown.value = activeModeVal;

  // Console log helpers
  function log(message, type = 'info') {
    const entry = document.createElement('div');
    entry.className = `console-entry ${type}`;
    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    entry.textContent = `[${now}] ${message}`;
    consoleBody.appendChild(entry);
    consoleBody.scrollTop = consoleBody.scrollHeight;
  }

  function toggleConsole() {
    consoleBody.classList.toggle('collapsed');
    consoleArrow.classList.toggle('collapsed');
  }

  // BLE GATT Connection Handling
  async function connectDevice() {
    try {
      log('Scanning for FloRo Bluetooth sign...', 'info');
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [
          { name: 'FloRo' },
          { namePrefix: 'FloRo' }
        ],
        optionalServices: [NUS_SERVICE_UUID]
      });

      deviceNameEl.textContent = bleDevice.name || 'FloRo Sign';
      deviceNameEl.style.color = 'var(--text)';
      log(`Found sign: ${bleDevice.name || 'FloRo'}`, 'success');

      bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

      log('Connecting to Bluetooth GATT...', 'info');
      bleServer = await bleDevice.gatt.connect();
      log('Bluetooth connection established.', 'success');

      connectionStatus.textContent = 'CONNECTED';
      connectionStatus.className = 'status-badge connected';
      btnConnect.classList.add('hidden');
      btnDisconnect.classList.remove('hidden');

      log('Discovering Nordic UART Service...', 'info');
      const service = await bleServer.getPrimaryService(NUS_SERVICE_UUID);
      
      log('Discovering Write Characteristic...', 'info');
      activeCharacteristic = await service.getCharacteristic(NUS_WRITE_UUID);
      log('Sign connected and ready for control.', 'success');

      // Enable UI Panels
      powerPanel.classList.remove('disabled-control');
      controlsPanel.classList.remove('disabled-control');
      colorPanel.classList.remove('disabled-control');
      animationPanel.classList.remove('disabled-control');

      // Sync initial power and brightness state
      isPoweredOn = true;
      updatePowerUI(true);
      sendBrightness(sliderBrightness.value);

    } catch (error) {
      log(`Connection error: ${error.message}`, 'error');
      resetUI();
    }
  }

  function disconnectDevice() {
    if (!bleDevice) return;
    log('Disconnecting from sign...', 'info');
    bleDevice.gatt.disconnect();
  }

  function onDisconnected() {
    log('Bluetooth connection lost.', 'error');
    resetUI();
  }

  function resetUI() {
    bleDevice = null;
    bleServer = null;
    activeCharacteristic = null;

    deviceNameEl.textContent = 'Disconnected';
    deviceNameEl.style.color = 'var(--text-muted)';
    connectionStatus.textContent = 'OFFLINE';
    connectionStatus.className = 'status-badge';
    
    btnConnect.classList.remove('hidden');
    btnDisconnect.classList.add('hidden');

    powerPanel.classList.add('disabled-control');
    controlsPanel.classList.add('disabled-control');
    colorPanel.classList.add('disabled-control');
    animationPanel.classList.add('disabled-control');
  }

  btnConnect.addEventListener('click', connectDevice);
  btnDisconnect.addEventListener('click', disconnectDevice);

  // BLE ASCII Write Method
  async function writeBytes(bytes) {
    if (!activeCharacteristic) {
      return false;
    }
    try {
      const asciiString = new TextDecoder().decode(bytes).trim();
      log(`Sending Command: "${asciiString}"`, 'write');
      
      if (activeCharacteristic.properties.writeWithoutResponse) {
        await activeCharacteristic.writeValueWithoutResponse(bytes);
      } else {
        await activeCharacteristic.writeValueWithResponse(bytes);
      }
      return true;
    } catch (error) {
      log(`Command failed: ${error.message}`, 'error');
      return false;
    }
  }

  function sendAscii(str, label = 'Command') {
    let processedStr = str;
    if (!processedStr.endsWith('\n')) {
      processedStr += '\n';
    }
    const encoder = new TextEncoder();
    const bytes = encoder.encode(processedStr);
    writeBytes(bytes);
  }

  // Neon Dynamic Styling
  function updateNeonThemeColor(hexColor) {
    activeColor = hexColor;
    document.documentElement.style.setProperty('--neon-glow', hexColor);
    document.documentElement.style.setProperty('--neon-glow-rgba', hexColor + '40'); // 25% opacity
    
    // Apply drop shadow glow on cards
    const panels = [powerPanel, controlsPanel, colorPanel, animationPanel];
    panels.forEach(p => {
      p.style.boxShadow = `0 8px 32px 0 rgba(0, 0, 0, 0.4), 0 0 16px 0 ${hexColor}20`;
      p.style.borderColor = `${hexColor}40`;
    });
  }

  // Power State Handler
  window.setPowerState = function(on) {
    isPoweredOn = on;
    updatePowerUI(on);
    if (on) {
      sendBrightness(lastBrightnessVal);
    } else {
      sendBrightness(0);
    }
  };

  function updatePowerUI(on) {
    if (on) {
      powerStatusText.textContent = "POWER ON";
      powerStatusText.className = "power-status-indicator";
      controlsPanel.classList.remove('disabled-control');
      colorPanel.classList.remove('disabled-control');
      animationPanel.classList.remove('disabled-control');
      sliderBrightness.value = lastBrightnessVal;
      valBrightness.textContent = `${lastBrightnessVal} / 8`;
    } else {
      powerStatusText.textContent = "POWER OFF";
      powerStatusText.className = "power-status-indicator off";
      controlsPanel.classList.add('disabled-control');
      colorPanel.classList.add('disabled-control');
      animationPanel.classList.add('disabled-control');
      valBrightness.textContent = "OFF";
    }
  }

  // Brightness Control Logic (1 to 8 range)
  function sendBrightness(val) {
    sendAscii(`B=${val};`, `Brightness set to ${val}`);
  }

  let bTimeout = null;
  sliderBrightness.addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    lastBrightnessVal = val;
    valBrightness.textContent = `${val} / 8`;
    
    if (bTimeout) clearTimeout(bTimeout);
    bTimeout = setTimeout(() => {
      if (isPoweredOn) {
        sendBrightness(val);
      }
    }, 120);
  });

  // Speed Control Logic
  let sTimeout = null;
  sliderSpeed.addEventListener('input', (e) => {
    const val = e.target.value;
    valSpeed.textContent = `${val}%`;
    
    if (sTimeout) clearTimeout(sTimeout);
    sTimeout = setTimeout(() => {
      sendAscii(`S=${val};`, `Speed set to ${val}%`);
    }, 120);
  });

  // Color Selection (Green & Blue physically swapped)
  window.selectSwatch = function(btn, r, g, b) {
    document.querySelectorAll('.swatch-btn').forEach(s => s.classList.remove('selected'));
    btn.classList.add('selected');
    
    const rgbToHex = (r, g, b) => '#' + [r, g, b].map(x => {
      const hex = x.toString(16);
      return hex.length === 1 ? '0' + hex : hex;
    }).join('');
    
    const hex = rgbToHex(r, g, b);
    updateNeonThemeColor(hex);
    colorPicker.value = hex;

    // Swapping green and blue parameters for the sign's physical LED channel wiring
    sendAscii(`C=${r},${b},${g};`, `Set Swatch (${r}, ${g}, ${b})`);
  };

  colorPicker.addEventListener('input', (e) => {
    const hexColor = e.target.value;
    updateNeonThemeColor(hexColor);
    
    document.querySelectorAll('.swatch-btn').forEach(s => s.classList.remove('selected'));

    const r = parseInt(hexColor.substring(1, 3), 16);
    const g = parseInt(hexColor.substring(3, 5), 16);
    const b = parseInt(hexColor.substring(5, 7), 16);
    
    if (window.colorTimeout) clearTimeout(window.colorTimeout);
    window.colorTimeout = setTimeout(() => {
      // Swapping green and blue channels for the physical LED wiring correction
      sendAscii(`C=${r},${b},${g};`, `Set Color Picker (${r}, ${g}, ${b})`);
    }, 150);
  });

  // Animation Mode Logic (1 to 200 range)
  animDropdown.addEventListener('change', (e) => {
    const mode = parseInt(e.target.value);
    setMode(mode);
  });

  window.stepMode = function(delta) {
    let mode = parseInt(animDropdown.value) + delta;
    if (mode < 1) mode = 200;
    if (mode > 200) mode = 1;
    animDropdown.value = mode;
    setMode(mode);
  };

  function setMode(mode) {
    activeModeVal = mode;
    sendAscii(`M=${mode};`, `Set Animation Mode ${mode}`);
    highlightActiveFavorite();
  }

  // Favorites Management Logic
  let favorites = [];

  function loadFavorites() {
    const stored = localStorage.getItem('floro_favorites');
    if (stored) {
      favorites = JSON.parse(stored);
    } else {
      favorites = [...defaultFavorites];
      saveFavorites();
    }
    renderFavorites();
  }

  function saveFavorites() {
    localStorage.setItem('floro_favorites', JSON.stringify(favorites));
  }

  function renderFavorites() {
    favoritesGrid.innerHTML = '';
    favorites.forEach((fav) => {
      const chip = document.createElement('div');
      chip.className = `fav-chip ${fav.mode === activeModeVal ? 'active' : ''}`;
      chip.setAttribute('data-mode', fav.mode);
      
      const labelSpan = document.createElement('span');
      labelSpan.textContent = fav.label;
      labelSpan.addEventListener('click', () => {
        animDropdown.value = fav.mode;
        setMode(fav.mode);
      });
      chip.appendChild(labelSpan);

      const removeBtn = document.createElement('span');
      removeBtn.className = 'fav-chip-remove';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeFavorite(fav.mode);
      });
      chip.appendChild(removeBtn);

      favoritesGrid.appendChild(chip);
    });
  }

  function highlightActiveFavorite() {
    document.querySelectorAll('.fav-chip').forEach(chip => {
      const mode = parseInt(chip.getAttribute('data-mode'));
      if (mode === activeModeVal) {
        chip.classList.add('active');
      } else {
        chip.classList.remove('active');
      }
    });
  }

  window.addCurrentToFavorites = function() {
    const mode = activeModeVal;
    if (favorites.some(f => f.mode === mode)) {
      log('Mode is already in your favorites.', 'info');
      return;
    }
    const name = prompt(`Enter a name for Animation Mode ${mode}:`, `Mode ${mode}`);
    if (name === null) return;
    
    favorites.push({ mode: mode, label: name.trim() || `Mode ${mode}` });
    saveFavorites();
    renderFavorites();
    log(`Added Mode ${mode} to presets.`, 'success');
  };

  function removeFavorite(mode) {
    favorites = favorites.filter(f => f.mode !== mode);
    saveFavorites();
    renderFavorites();
    log(`Removed Mode ${mode} from presets.`, 'info');
  }

  // Load favorites on startup
  loadFavorites();

  // PWA Install Prompt handling
  let deferredPrompt;
  const installBanner = document.getElementById('install-banner');
  const btnInstall = document.getElementById('btn-install');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBanner.classList.remove('hidden');
  });

  btnInstall.addEventListener('click', () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        log('User installed FloRo Controller app.', 'success');
      }
      installBanner.classList.add('hidden');
      deferredPrompt = null;
    });
  });
</script>
</body>
</html>
